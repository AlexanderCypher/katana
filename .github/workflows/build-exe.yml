name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name KatanaPatchConverter katana_to_gen1.py
      - uses: actions/upload-artifact@v4
        with:
          name: KatanaPatchConverter
          path: dist/KatanaPatchConverter.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/KatanaPatchConverter.exe
