name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get real MkII sample patches (katana-rs)
        run: git clone --depth 1 https://github.com/syndicalt/katana-rs ../katana-rs
      - name: Run tests
        env:
          KATANA_SAMPLES: ../katana-rs/assets/patches
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
